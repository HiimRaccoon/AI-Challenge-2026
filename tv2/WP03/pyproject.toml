[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aic2026-wp03"
version = "0.1.0"
description = "WP03 visual ensemble retrieval"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyarrow>=16",
  "PyYAML>=6",
  "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wp03 = "wp03.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
