[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tv4"
version = "0.1.0"
description = "AIC 2026 - TV4: Query Router, Multimodal Fusion, KIS/VQA/TRAKE (WP07, WP10, WP11, WP12)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Required only for the optional HTTP API consumed by TV5.  The handoff CLI
# itself still needs only PyYAML and its upstream services.
api = ["fastapi>=0.110", "uvicorn>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
